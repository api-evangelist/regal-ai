source: mcp/regal-ai-mcp.yml + openapi/ (operationIds verified against the specs in this repo)
note: >-
  Binds each published Regal MCP tool to the REST operation(s) that back it. Regal's MCP
  surface is much wider than its public REST surface: 60 published tools against 13 public
  REST operations. The MCP server exposes the agent-builder, journey, task/routing,
  recording/transcript, simulation and contact-profile cores of the platform that have no
  public REST equivalent at all. Live tools/list introspection is OAuth-gated (HTTP 401
  invalid_token), so bindings are mapped by published name and description, not by
  observed inputSchema — confidence is set accordingly.
surfaces:
