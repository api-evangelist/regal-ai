rest_only:
  - capability: event and contact ingestion
    operations: [postCustomEvent]
    note: >-
      The Custom Events ingest endpoint (POST https://events.regalvoice.com/events) is the
      primary write path into Regal and has no MCP tool. An agent can read a profile over
      MCP (lookup-profile / fetch-profile) but cannot create or update one.
  - capability: outbound SMS
    operations: [sendMessage]
    note: No MCP tool sends a message; messaging remains REST-only.
  - capability: campaigns
    operations: [listCampaigns]
    note: No campaigns tool is published on the MCP server.
  - capability: call handoff routing instructions
    operations: [getCallHandoff]
    note: Five9 AI Agent Connect handoff retrieval is REST-only.
