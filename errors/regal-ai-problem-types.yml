      - openapi/regal-ai-call-handoffs-api-openapi.yml#getCallHandoff
  - status: 403
    title: Forbidden
    envelope: application
    example: '{"statusCode": 403, "message": "Invalid API Key", "error": "Forbidden"}'
    remediation: >-
      The key was present but is not valid for this brand, or the brand is not entitled to
      the resource. Regal returns 403 (not 401) for a wrong key on the application-layer
      endpoints — treat 403 as an auth failure, not an authorization-only failure.
    source_operations:
