format: none
format_note: >-
  Regal does NOT use RFC 9457 problem+json. Every documented error is application/json and
  falls into one of two envelopes, which is itself a finding: an agent cannot write one
  error handler for the Regal API. The gateway envelope is {"message": "..."} and the
  application envelope is {"statusCode": <int>, "message": <string|string[]>, "error":
  "<reason phrase>"}. Validation failures return `message` as an ARRAY of human-readable
  strings with no machine-readable field pointers or error codes, so a caller cannot map a
  400 back to a request field programmatically. There is no error `code` vocabulary
  anywhere in the published contract.
envelopes:
  - id: gateway
    shape: '{"message": "<reason>"}'
    used_by: [postCustomEvent, listActivePhoneNumbers, listBusinessProfiles, listCampaigns, listDispositions, listBrandedPhoneNumbers, listUsers, sendMessage]
    note: Emitted by the API Gateway/auth layer. Seen on 401 and on sendMessage 429.
  - id: application
    shape: '{"statusCode": <int>, "message": <string|string[]>, "error": "<reason phrase>"}'
    used_by: [postBrandedPhoneNumber, patchBrandedPhoneNumber, deleteBrandedPhoneNumber, sendMessage]
    note: >-
      NestJS-style envelope emitted by the application layer. `message` is an array of
      validation strings on 400 and a single string on 403/404/409/429.
problems:
