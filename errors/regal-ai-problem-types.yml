  - status: 404
    title: Not Found
    envelope: application
    example: '{"statusCode": 404, "message": "Phone number +12123333333 not found for this brand", "error": "Not Found"}'
    remediation: >-
      The addressed resource does not exist within the authenticated brand. Documented
      variants: "Phone number ... not found for this brand", "User not found for this
      brand.", "No handoff data found for the given callKey".
    source_operations:
      - openapi/regal-ai-branded-phone-numbers-api-openapi.yml#patchBrandedPhoneNumber
      - openapi/regal-ai-branded-phone-numbers-api-openapi.yml#deleteBrandedPhoneNumber
