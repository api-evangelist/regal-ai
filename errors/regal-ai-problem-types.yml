  - status: 401
    title: Unauthorized
    envelope: gateway
    example: '{"message": "Unauthorized"}'
    remediation: >-
      No Authorization header, or a header the gateway cannot parse. Send the API key in
      the Authorization header on every request (see
      authentication/regal-ai-authentication.yml). Keys are issued by support@regal.ai.
    source_operations:
      - openapi/regal-ai-events-api-openapi.yml#postCustomEvent
      - openapi/regal-ai-messages-api-openapi.yml#sendMessage
      - openapi/regal-ai-users-api-openapi.yml#listUsers
