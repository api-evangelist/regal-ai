gaps:
  - No error code vocabulary — errors are identified only by HTTP status plus prose.
  - Two different error envelopes across one API surface.
  - No 5xx responses are documented on any operation.
  - No Retry-After or RateLimit-* headers documented on 429.
  - No application/problem+json anywhere.
