  - status: 409
    title: Conflict
    envelope: application
    example: '{"statusCode": 409, "message": "Phone number +17378888888 already exists for this brand. Use PATCH to update.", "error": "Conflict"}'
    remediation: >-
      POST /brandedPhoneNumbers is first-time registration only. On 409, switch to PATCH
      /brandedPhoneNumbers/{phoneNumber}. This is the one place Regal's error message
      carries an explicit next action.
    source_operations:
      - openapi/regal-ai-branded-phone-numbers-api-openapi.yml#postBrandedPhoneNumber
  - status: 429
    title: Rate Limit Exceeded
    envelope: application
    example: '{"statusCode": 429, "message": "Too many requests", "error": "Rate Limit Exceeded"}'
    remediation: >-
      Back off and retry. Regal publishes NO rate-limit response headers — no
      X-RateLimit-*, no RateLimit-*, no Retry-After appears anywhere in the published
      contract or docs — so a client has no runtime signal of remaining budget and must
      pace itself against the documented static limits in
      rate-limits/regal-ai-rate-limits.yml (300 rps on the events ingest, 10 rps on the v1
      management endpoints).
    variants:
      - '{"message": "Too Many Requests"}   # gateway envelope, sendMessage'
    source_operations:
      - openapi/regal-ai-messages-api-openapi.yml#sendMessage
      - openapi/regal-ai-users-api-openapi.yml#listUsers
      - openapi/regal-ai-users-api-openapi.yml#getUser
