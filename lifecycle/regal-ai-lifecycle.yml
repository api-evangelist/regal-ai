tenant_level_lifecycle:
  note: >-
    Regal ships a real lifecycle model INSIDE the product that has no counterpart in the
    API contract: AI agents have Draft and Active versions, full version history, and
    variants with traffic allocation for A/B tests. Agents can be rolled back to a prior
    version. All of it is reachable over MCP (list-ai-agent-versions,
    fetch-agent-version, set-variant-traffic-allocations) and none of it over REST.
