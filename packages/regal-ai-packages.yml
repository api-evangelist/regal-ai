note: >-
  Regal publishes NO first-party server-side SDK in any package registry. npm registry
  search for "regal", "regal.ai" and "regalvoice" returns only unrelated projects (the
  Regal game framework, Pipedream components, spam packages); pypi.org/pypi/regal/json is
  boylegu/regal, an unrelated A/B testing library; pypi regal-ai and regalvoice both 404.
  The GitHub organisation github.com/regal-ai exists and lists regal.ai as its blog but
  has 0 public repositories. The only first-party distributed client artifact Regal ships
  is the browser Conversations SDK / Regal Widget loader, served from its own CloudFront
  CDN with no registry and no pinned version. Integration is otherwise raw HTTPS + API key
  (see authentication/regal-ai-authentication.yml) or the hosted MCP server
  (mcp/regal-ai-mcp.yml).
